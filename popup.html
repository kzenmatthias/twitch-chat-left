<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 220px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        color: #e5e5e5;
        background: #18181b;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #efeff1;
      }
      h3.sub {
        margin-top: 18px;
      }
      .options {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px;
        border: 2px solid #3a3a3d;
        border-radius: 6px;
        background: #26262c;
        color: #e5e5e5;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
      }
      button:hover {
        background: #323238;
      }
      button.active {
        border-color: #9146ff;
        background: #2c2040;
        color: #bf94ff;
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .switch input {
        appearance: none;
        -webkit-appearance: none;
        width: 34px;
        height: 20px;
        border-radius: 10px;
        background: #3a3a3d;
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      .switch input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #efeff1;
        transition: transform 0.15s;
      }
      .switch input:checked {
        background: #9146ff;
      }
      .switch input:checked::after {
        transform: translateX(14px);
      }
      .hint {
        margin-top: 6px;
        font-size: 11px;
        color: #8a8a90;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h3>Chat position</h3>
    <div class="options">
      <button id="left">Left</button>
      <button id="right">Right</button>
    </div>

    <h3 class="sub">Channel points</h3>
    <label class="switch">
      <input type="checkbox" id="auto-claim" />
      <span>Auto-claim bonus</span>
    </label>
    <div class="hint">Clicks the green claim button after a random 5–25s delay.</div>

    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 200px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        color: #e5e5e5;
        background: #18181b;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #efeff1;
      }
      .options {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px;
        border: 2px solid #3a3a3d;
        border-radius: 6px;
        background: #26262c;
        color: #e5e5e5;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
      }
      button:hover {
        background: #323238;
      }
      button.active {
        border-color: #9146ff;
        background: #2c2040;
        color: #bf94ff;
      }
    </style>
  </head>
  <body>
    <h3>Chat position</h3>
    <div class="options">
      <button id="left">Left</button>
      <button id="right">Right</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
